services:
  backend:
    container_name: customer-churn-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_NAME=Telco Customer Churn Prediction API
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_PATH=models/churn_pipeline.joblib
      - METRICS_PATH=models/metrics.json
      - DATA_PATH=data/WA_Fn-UseC_-Telco-Customer-Churn.csv
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - logs_data:/app/logs
    restart: unless-stopped
    networks:
      - customer-churn-network

  frontend:
    container_name: customer-churn-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - customer-churn-network

networks:
  customer-churn-network:
    driver: bridge

volumes:
  logs_data:
